server:
  port: 8080

spring:
  application:
    name: nineteens-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nineteens}
    username: ${DB_USERNAME:nineteens}
    password: ${DB_PASSWORD:nineteens}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB

logging:
  level:
    com.nineteens: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:nineteens-dev-secret-change-me-please-32b!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    local-dir: ${STORAGE_DIR:./uploads}
    public-prefix: /api/files
  shipping:
    cost: ${SHIPPING_COST:80}
