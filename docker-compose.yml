services:
  postgres:
    image: postgres:16-alpine
    container_name: nineteens-postgres
    environment:
      POSTGRES_DB: nineteens
      POSTGRES_USER: nineteens
      POSTGRES_PASSWORD: nineteens
    ports:
      - "5432:5432"
    volumes:
      - nineteens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nineteens -d nineteens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nineteens-pgdata:
